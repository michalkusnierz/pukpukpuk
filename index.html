<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<style>body{margin:0}</style>
</head>
<body>
<title>PUKPUKPUK</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400..900&amp;family=Barlow+Condensed:wght@700;800&amp;display=swap">
<style>
body{margin:0;background:#ECEEED}
html{scroll-behavior:smooth}
a{color:#10252A}a:hover{color:#12343B}
input[type=checkbox]{accent-color:#10252A;width:20px;height:20px}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #10252A;outline-offset:3px}
.fz-tab{grid-template-columns:200px minmax(0,1fr)}
@media (max-width:640px){.fz-tab{grid-template-columns:minmax(0,1fr)}.fz-tab>div:nth-child(odd){padding-top:18px!important;font-size:18px!important}.fz-tab>div:nth-child(even):not(.fz-price){font-size:21px!important}}
.fz-video{object-position:50% 60%}
@media (max-width:700px){.fz-video{object-position:42% 60%}}
.fz-pan{animation:fz-pan 40s linear infinite alternate}
@keyframes fz-pan{from{transform:translateX(0)}to{transform:translateX(-37.5%)}}
@media (prefers-reduced-motion:reduce){.fz-pan{animation:none}}
@keyframes fz-pop{from{opacity:0;transform:scale(1.35)}to{opacity:1;transform:none}}
@keyframes fz-k1{0%,100%{translate:0 0}30%{translate:5px 0}60%{translate:-3px 0}}
@keyframes fz-k3{0%,100%{translate:0 0}30%{translate:5px 0}60%{translate:-3px 0}}
@keyframes fz-k2{0%,100%{translate:0 0}30%{translate:5px 0}60%{translate:-3px 0}}
@keyframes fz-knock{0%,50%,100%{translate:0 0}12%,62%{translate:4px 0}25%,75%{translate:-3px 0}}
@keyframes fz-up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes fz-stamp{0%{opacity:0;transform:rotate(-9deg) scale(1.6)}70%{opacity:1;transform:rotate(-9deg) scale(.96)}100%{opacity:1;transform:rotate(-9deg) scale(1)}}
</style>
<div id="app"></div>
<template id="tpl">
<div style="font-family: 'Schibsted Grotesk', system-ui, sans-serif; color: #10252A; background: #ECEEED; min-height: 100vh">

<!-- INTRO: puk puk -->
<sc-if value="{{introOn}}" hint-placeholder-val="{{true}}">
<section style="position: relative; height: 100vh; min-height: 680px; background: {{introBg}}; transition: background-color .5s ease .9s; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 48px; padding: 40px 20px; box-sizing: border-box">

<span style="display: block; font-weight: 900; opacity: {{askO}}; transform: {{askT}}; transition: opacity .5s ease .1s, transform .7s cubic-bezier(.2,.8,.2,1) .1s">Chcę kupić dom.</span>

<span aria-hidden="true" style="position: absolute; left: 50%; top: 7%; bottom: 7%; width: 2px; background: #12343B"></span>
<span aria-hidden="true" style="position: absolute; left: 67%; top: 7%; bottom: 7%; width: 2px; background: #12343B"></span>
<span aria-hidden="true" style="position: absolute; right: 12%; top: 33%; width: 6px; height: 34%; background: #EDEDF2; border-radius: 3px"></span>
</button>
</div>
<span aria-hidden="true" style="position: absolute; left: calc(100% + 18px); top: 22%; font-weight: 800; font-size: 20px; color: #FFFFFF; letter-spacing: -0.02em">12</span>
<span aria-hidden="true" style="position: absolute; left: -30%; right: -30%; top: 100%; height: 64px; background: #FFB547; opacity: {{spill}}; clip-path: polygon(28% 0, 72% 0, 100% 100%, 0 100%); transition: opacity .5s ease .15s"></span>

</div>
</div>
</section>
</sc-if>
